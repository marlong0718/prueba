<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Launcher</title>
<meta name="viewport" content="width=1920, height=1080">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="clock">--:--</h1>
    <span id="date"></span>
    <span id="status"></span>
  </header>
  <main>
    <h2>Favoritos</h2>
    <section id="favs" class="grid"></section>
    <h2>Entradas</h2>
    <section id="inputs" class="grid"></section>
    <h2>Todas las apps</h2>
    <section id="all" class="grid"></section>
  </main>
  <footer>OK: abrir · Amarillo: fijar/quitar favorito · Atrás: salir</footer>
  <script src="app.js"></script>
</body>
</html>
